  <g shape-rendering="geometricPrecision">
    <rect x="250" y="46" width="100" height="12" fill="#7566A8"/>
    <rect x="250" y="72" width="48" height="12" fill="#75D5D0"/>
    <rect x="250" y="98" width="64" height="12" fill="#B68B55"/>
