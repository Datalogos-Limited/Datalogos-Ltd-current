  </g>
  <text x="300" y="211" text-anchor="middle" fill="#101D32" font-family="Helvetica Neue Thin, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="34" font-weight="200" letter-spacing="7">VERITY</text>
  <text x="300" y="248" text-anchor="middle" fill="#1A2C46" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="300" letter-spacing="4">DATA ASSURANCE</text>
