<svg xmlns="http://www.w3.org/2000/svg" width="600" height="320" viewBox="0 0 600 320" role="img" aria-labelledby="title desc">
  <title id="title">Draft Counterpoise logo with bronze accent</title>
  <desc id="desc">A central teal axis balances ink bars, with one bronze control segment, above the Counterpoise wordmark.</desc>
  <g shape-rendering="geometricPrecision">
    <rect x="292" y="34" width="16" height="112" fill="#1E9B98"/>
    <rect x="248" y="69" width="36" height="10" fill="#101D32"/>
    <rect x="316" y="69" width="36" height="10" fill="#101D32"/>
    <rect x="316" y="101" width="24" height="10" fill="#B68B55"/>
  </g>
  <text x="300" y="211" text-anchor="middle" fill="#101D32" font-family="Helvetica Neue Thin, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="32" font-weight="200" letter-spacing="5">COUNTERPOISE</text>
  <text x="300" y="248" text-anchor="middle" fill="#1A2C46" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="300" letter-spacing="4">MODULAR AI GOVERNANCE</text>
</svg>
