<svg xmlns="http://www.w3.org/2000/svg" width="600" height="320" viewBox="0 0 600 320" role="img" aria-labelledby="title desc">
  <title id="title">Draft Datalogos logo</title>
  <desc id="desc">A geometric portfolio mark built from an ink vertical spine with balanced teal, cyan and bronze data bars, above the Datalogos wordmark.</desc>
  <g shape-rendering="geometricPrecision">
    <rect x="292" y="34" width="16" height="104" fill="#101D32"/>
    <rect x="248" y="55" width="36" height="10" fill="#1E9B98"/>
    <rect x="316" y="55" width="36" height="10" fill="#75D5D0"/>
    <rect x="260" y="103" width="24" height="10" fill="#B68B55"/>
    <rect x="316" y="103" width="24" height="10" fill="#101D32"/>
  </g>
  <text x="300" y="211" text-anchor="middle" fill="#101D32" font-family="Helvetica Neue Thin, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="34" font-weight="200" letter-spacing="7">DATALOGOS</text>
  <text x="300" y="248" text-anchor="middle" fill="#1A2C46" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="300" letter-spacing="4">PEOPLE  ·  DATA  ·  PROGRESS</text>
</svg>
